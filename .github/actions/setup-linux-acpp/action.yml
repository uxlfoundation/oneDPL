name: Set up AdaptiveCpp on Linux
description: Installs AdaptiveCpp dependencies, builds and installs AdaptiveCpp, and configures its environment

inputs:
  version:
    description: AdaptiveCpp Git branch or tag to build
    required: false
    default: 'develop'
  install-dir:
    description: Directory where AdaptiveCpp will be installed
    required: false
    default: '/tmp/acpp'
  cache-dir:
    description: Directory used for AdaptiveCpp appdb cache (ACPP_APPDB_DIR)
    required: false
    default: '/tmp/acpp_cache'

runs:
  using: composite
  steps:
    - name: Install AdaptiveCpp dependencies
      shell: bash
      run: |
        set -exo pipefail
        # See the list of dependencies in https://github.com/AdaptiveCpp/AdaptiveCpp/blob/develop/doc/installing.md
        sudo apt-get update -y
        # Boost and LLVM 18 packages for Ubuntu 24.04
        sudo apt-get install -y \
          libboost-context-dev libboost-fiber-dev \
          libclang-18-dev clang-tools-18 libomp-18-dev llvm-18-dev lld-18 llvm-18 clang-18
    - name: Build and install AdaptiveCpp
      shell: bash
      env:
        ACPP_VERSION: ${{ inputs.version }}
        ACPP_INSTALL_DIR: ${{ inputs.install-dir }}
        ACPP_CACHE_DIR: ${{ inputs.cache-dir }}
      run: |
        set -exo pipefail
        src_dir="${RUNNER_TEMP}/AdaptiveCpp"

        mkdir -p "${ACPP_INSTALL_DIR}" "${ACPP_CACHE_DIR}"
        git clone --depth 1 --branch "${ACPP_VERSION}" https://github.com/AdaptiveCpp/AdaptiveCpp.git "${src_dir}"
        # Install for hipSYCL OpenMP host device (default)
        cmake -S "${src_dir}" -B "${src_dir}/build" \
          -DCMAKE_INSTALL_PREFIX="${ACPP_INSTALL_DIR}" \
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
        cmake --build "${src_dir}/build" --target install -j"$(nproc)"
        rm -rf "${src_dir}"

        echo "${ACPP_INSTALL_DIR}/bin" >> "${GITHUB_PATH}"
        echo "CPATH=${ACPP_INSTALL_DIR}/include/AdaptiveCpp${CPATH:+:${CPATH}}" >> "${GITHUB_ENV}"
        echo "LIBRARY_PATH=${ACPP_INSTALL_DIR}/lib${LIBRARY_PATH:+:${LIBRARY_PATH}}" >> "${GITHUB_ENV}"
        echo "ACPP_APPDB_DIR=${ACPP_CACHE_DIR}" >> "${GITHUB_ENV}"
