name: Set up Intel® oneAPI on Linux
description: Registers the Intel oneAPI APT repository and installs the requested components

inputs:
  tbb:
    description: Install Intel® oneAPI Threading Building Blocks
    required: false
    default: 'false'
  compiler:
    description: Install Intel® oneAPI DPC++/C++ Compiler
    required: false
    default: 'false'
  fpga:
    description: Install Intel® oneAPI DPC++/C++ Compiler with SYCL* FPGA Emulator Runtime
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Intel APT repository
      if: inputs.tbb == 'true' || inputs.compiler == 'true' || inputs.fpga == 'true'
      shell: bash
      run: |
        # https://www.intel.com/content/www/us/en/docs/oneapi/installation-guide-linux/2024-0/apt.html
        success=false
        for i in 1 2 3 4 5; do
          if wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
          | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null; then
            success=true
            break
          fi
          if [ "$i" -lt 5 ]; then
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          else
            echo "Attempt $i failed; no more retries left."
          fi
        done
        if [ "$success" = false ]; then
          echo "Failed to download Intel GPG key after 5 attempts"
          exit 1
        fi
        echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
        sudo apt-get update -y
    - name: Install Intel® oneAPI Threading Building Blocks
      if: inputs.tbb == 'true'
      shell: bash
      run: |
        sudo apt-get install intel-oneapi-tbb-devel -y
    - name: Install Intel® oneAPI DPC++/C++ Compiler
      if: inputs.compiler == 'true'
      shell: bash
      run: |
        sudo apt-get install intel-oneapi-compiler-dpcpp-cpp -y
        # Avoid accidental use of a released version, keeping libpstloffload.so.
        sudo rm -rf "${LINUX_ONEAPI_PATH:?}/dpl/latest/include"
    - name: Install Intel® oneAPI DPC++/C++ Compiler with SYCL* FPGA Emulator Runtime
      if: inputs.fpga == 'true'
      shell: bash
      run: |
        sudo apt-get install intel-oneapi-compiler-fpga -y
